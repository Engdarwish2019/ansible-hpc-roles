---
- name: Create tmpfiles
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/slurm.conf
  changed_when: true

- name: Restart slurmdbd
  ansible.builtin.systemd_service:
    name: slurmdbd
    state: restarted

- name: Restart slurmctld
  ansible.builtin.systemd_service:
    name: slurmctld
    state: restarted

- name: Restart slurmd
  ansible.builtin.systemd_service:
    name: slurmd
    state: restarted

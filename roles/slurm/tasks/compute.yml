---
- name: Install slurmd
  ansible.builtin.dnf:
    name: slurm-slurmd
    state: present

- name: Point slurmd at the controller (configless mode)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      SLURMD_OPTIONS="--conf-server {{ slurm_controller_host }}:6817"
    dest: /etc/sysconfig/slurmd
    owner: root
    group: root
    mode: "0644"
  when: slurm_configless
  notify: Restart slurmd

- name: Copy the configuration to compute nodes (classic mode)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/slurm/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - slurm.conf
    - cgroup.conf
    - gres.conf
  when: not slurm_configless
  notify: Restart slurmd

- name: Enable slurmd
  ansible.builtin.systemd_service:
    name: slurmd
    state: started
    enabled: true

---
- name: Install MUNGE
  ansible.builtin.dnf:
    name:
      - munge
      - munge-libs
    state: present

- name: Generate the MUNGE key on the controller (never stored in git)
  ansible.builtin.command:
    cmd: dd if=/dev/urandom bs=1 count=1024 of={{ munge_key_path }} status=none
    creates: "{{ munge_key_path }}"
  when: inventory_hostname == munge_key_host

- name: Read the key from the controller
  ansible.builtin.slurp:
    src: "{{ munge_key_path }}"
  register: munge_key
  delegate_to: "{{ munge_key_host }}"
  run_once: true
  no_log: true

- name: Install the same key on every node
  ansible.builtin.copy:
    content: "{{ munge_key.content | b64decode }}"
    dest: "{{ munge_key_path }}"
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  notify: Restart munge

- name: Enable MUNGE
  ansible.builtin.systemd_service:
    name: munge
    state: started
    enabled: true

- name: Flush handlers so MUNGE runs with the shared key
  ansible.builtin.meta: flush_handlers

- name: Check that MUNGE can encode and decode a credential
  ansible.builtin.shell:
    cmd: set -o pipefail && munge -n | unmunge
  changed_when: false

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint / ansible-lint / syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: yamllint
        run: yamllint .

      - name: ansible-lint (production profile)
        run: ansible-lint

      - name: Syntax check playbooks
        run: |
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/lab/xcat.example.yml playbooks/xcat.yml --syntax-check

      - name: Render slurm.conf from a sample inventory
        run: ansible-playbook -i tests/inventory.yml tests/render-slurm-conf.yml

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

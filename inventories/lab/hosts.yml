---
# Lab inventory for the Vagrant cluster (see Vagrantfile).
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ".vagrant/machines/{{ inventory_hostname }}/libvirt/private_key"
  children:
    slurm_controller:
      hosts:
        head:
          ansible_host: 192.168.60.10
    nfs_server:
      hosts:
        head:
    slurm_compute:
      children:
        slurm_cpu:
          hosts:
            compute-01:
              ansible_host: 192.168.60.11
            compute-02:
              ansible_host: 192.168.60.12
        slurm_gpu:
          hosts: {}
